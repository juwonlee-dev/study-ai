<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>최대준 프로필</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@700&family=Gowun+Dodum&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fdf3c8;
      --bg-deep: #fbe7a1;
      --card: #fffbec;
      --line: #f3dc8f;
      --row-label: #fdf1c4;
      --pill: #fbe08a;
      --pill-soft: #fcea9f;
      --accent: #f5c518;
      --accent-deep: #e9a90f;
      --ink: #3b2a12;
      --ink-soft: #5c4520;
      --brown: #5a3b12;
      --male: #2f7fd1;
      --leaf: #3f7d32;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #f6e9b8;
      font-family: "Gowun Dodum", "Malgun Gothic", sans-serif;
      color: var(--ink);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 12px;
    }

    .page {
      position: relative;
      width: 100%;
      max-width: 640px;
      background: linear-gradient(180deg, #fdf5d3 0%, var(--bg) 55%, var(--bg-deep) 100%);
      border-radius: 20px;
      overflow: hidden;
      padding: 28px 22px 60px;
      box-shadow: 0 10px 30px rgba(160, 120, 20, 0.18);
    }

    /* ---------- Header ---------- */
    .hero {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 260px;
      align-items: end;
      min-height: 250px;
    }

    .hero-text { position: relative; padding-left: 22px; z-index: 2; }

    .hello {
      font-family: "Jua", sans-serif;
      font-size: 44px;
      line-height: 1.1;
      color: var(--ink);
      margin-left: 50px;
      margin-top: 18px;
    }

    .name {
      position: relative;
      display: inline-block;
      font-family: "Jua", sans-serif;
      font-size: 76px;
      line-height: 1.05;
      color: var(--ink);
      margin: 4px 0 0 40px;
    }

    .name::after {
      content: "";
      position: absolute;
      left: 4px;
      right: 18px;
      bottom: 6px;
      height: 12px;
      background: var(--accent);
      border-radius: 8px;
      opacity: 0.75;
      z-index: -1;
      transform: rotate(-1.5deg);
    }

    .deco { position: absolute; }

    .role-pill {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-top: 26px;
      padding: 12px 24px;
      background: var(--pill);
      border-radius: 999px;
      font-family: "Jua", sans-serif;
      font-size: 22px;
      color: var(--ink);
      white-space: nowrap;
    }

    .role-pill .code { font-weight: bold; letter-spacing: -1px; }
    .role-pill .divider { width: 2px; height: 22px; background: var(--ink); opacity: 0.7; margin: 0 6px; }
    .role-pill svg { width: 26px; height: 26px; }

    .hero-art { position: relative; height: 250px; z-index: 1; }
    .hero-art svg.boy { position: absolute; right: 34px; bottom: -14px; width: 240px; }
    .hero-art svg.cat { position: absolute; right: -12px; bottom: -14px; width: 92px; z-index: 3; }
    .hero-art svg.bulb { position: absolute; right: 30px; top: -10px; width: 64px; }

    .together {
      position: absolute;
      right: 2px;
      top: 70px;
      font-family: "Gaegu", cursive;
      font-size: 20px;
      line-height: 1.05;
      color: var(--brown);
      transform: rotate(-14deg);
      text-align: left;
    }

    .together .heart { color: var(--brown); font-size: 16px; }

    /* ---------- Card ---------- */
    .card {
      position: relative;
      z-index: 2;
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 28px;
      padding: 22px 24px 26px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: "Jua", sans-serif;
      font-size: 32px;
      color: var(--ink);
      margin-bottom: 16px;
    }

    .section-title svg { width: 44px; height: 44px; flex-shrink: 0; }

    .section-title::after {
      content: "";
      flex: 1;
      height: 2px;
      background: var(--accent-deep);
      opacity: 0.55;
      margin-left: 14px;
    }

    .about-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      border: 2px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      font-size: 20px;
    }

    .about-table th,
    .about-table td {
      padding: 14px 18px;
      border-bottom: 2px solid var(--line);
      text-align: left;
      vertical-align: middle;
    }

    .about-table tr:last-child th,
    .about-table tr:last-child td { border-bottom: none; }

    .about-table th {
      width: 42%;
      background: var(--row-label);
      font-weight: normal;
      color: var(--ink-soft);
    }

    .about-table th .label { display: flex; align-items: center; gap: 22px; white-space: nowrap; }
    .about-table th svg { width: 34px; height: 34px; flex-shrink: 0; }
    .about-table td { background: #fffdf3; color: var(--ink); }

    .interests-title { margin-top: 34px; }

    .interests {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: 2px solid var(--line);
      border-radius: 14px;
      background: #fffdf3;
      padding: 18px 10px;
    }

    .interest {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 0 8px;
    }

    .interest + .interest { border-left: 2px solid var(--line); }
    .interest svg { width: 80px; height: 80px; }

    .interest .tag {
      width: 100%;
      text-align: center;
      background: var(--pill-soft);
      border-radius: 999px;
      padding: 10px 6px;
      font-family: "Jua", sans-serif;
      font-size: 15px;
      white-space: nowrap;
      color: var(--ink);
    }

    .quote {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 22px;
      padding: 12px 14px;
      background: linear-gradient(90deg, transparent, #fbe69a 8%, #fbe69a 92%, transparent);
      border-radius: 12px;
      font-family: "Gaegu", cursive;
      font-size: 18px;
      color: var(--ink);
      text-align: center;
      white-space: nowrap;
      word-break: keep-all;
    }

    .quote svg { width: 26px; height: 26px; flex-shrink: 0; }

    /* ---------- Footer ---------- */
    .footer {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 22px;
    }

    .thanks {
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: "Jua", sans-serif;
      font-size: 28px;
      color: var(--brown);
    }

    .thanks svg { width: 22px; height: 22px; }

    .nice-day {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 26px;
      background: var(--accent);
      border-radius: 999px;
      color: #fffdf3;
      font-size: 20px;
      font-weight: bold;
    }

    .nice-day svg { width: 26px; height: 26px; }

    .clouds { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 130px; z-index: 1; }

    /* ---------- Responsive ---------- */
    @media (max-width: 560px) {
      .page { padding: 20px 14px 80px; }
      .hero { grid-template-columns: 1fr; }
      .hero-text { padding-left: 0; text-align: center; }
      .hello { margin-left: 0; font-size: 36px; }
      .name { margin-left: 0; font-size: 60px; }
      .role-pill { font-size: 17px; padding: 10px 16px; gap: 8px; }
      .hero-art { height: 230px; margin-top: 10px; }
      .hero-art svg.boy { left: 50%; right: auto; transform: translateX(-55%); }
      .hero-art svg.cat { right: 6%; }
      .together { right: 4%; top: 70px; }
      .hero-text .deco { display: none; }
      .section-title { font-size: 26px; }
      .about-table { font-size: 17px; }
      .about-table th .label { gap: 12px; }
      .interest svg { width: 60px; height: 60px; }
      .interest .tag { font-size: 12px; white-space: normal; }
      .quote { font-size: 17px; white-space: normal; }
    }
  </style>
</head>
<body>
