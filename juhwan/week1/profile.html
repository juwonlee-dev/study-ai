<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 675px; }
  body {
    font-family: "Apple SD Gothic Neo", sans-serif;
    background: linear-gradient(135deg, #1e1b4b 0%, #312e81 55%, #4c1d95 100%);
    color: #f8fafc; display: flex; align-items: center; justify-content: center;
  }
  .card {
    width: 1040px; height: 520px; box-sizing: border-box; padding: 56px 64px;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18);
    border-radius: 32px; display: flex; gap: 56px; align-items: center;
  }
  .avatar {
    flex: none; width: 240px; height: 240px; border-radius: 50%;
    background: linear-gradient(135deg, #a78bfa, #22d3ee);
    display: flex; align-items: center; justify-content: center;
    font-size: 96px; font-weight: 800; color: #1e1b4b;
  }
  .info { flex: 1; }
  .hello { font-size: 22px; letter-spacing: 4px; color: #c4b5fd; margin: 0 0 8px; }
  h1 { font-size: 64px; margin: 0 0 28px; font-weight: 800; }
  dl { display: grid; grid-template-columns: 110px 1fr 110px 1fr; gap: 14px 16px; margin: 0 0 32px; font-size: 26px; }
  dt { color: #a5b4fc; }
  dd { margin: 0; font-weight: 700; }
  .why { border-top: 1px solid rgba(255,255,255,.2); padding-top: 22px; }
  .why h2 { font-size: 20px; color: #67e8f9; margin: 0 0 8px; font-weight: 700; }
  .why p { font-size: 24px; margin: 0; }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">허</div>
    <div class="info">
      <p class="hello">HELLO, I'M</p>
      <h1>허주환</h1>
      <dl>
        <dt>이름</dt><dd>허주환</dd>
        <dt>성별</dt><dd>남</dd>
        <dt>생년월일</dt><dd>1999-06-30</dd>
        <dt>나이</dt><dd>28</dd>
        <dt>MBTI</dt><dd>INFJ</dd>
      </dl>
      <div class="why">
        <h2>Claude Code(AI) 사용 이유</h2>
        <p>업무 생산성 향상을 목적으로 사용했습니다.</p>
      </div>
    </div>
  </div>
</body>
</html>
